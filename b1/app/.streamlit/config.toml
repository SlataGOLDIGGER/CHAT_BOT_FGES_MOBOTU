# Thème de l'interface du volet B (Streamlit 1.64) : palette « Lin & cuivre », en clair et en sombre.
# Streamlit lit ce fichier parce que le dossier .streamlit est placé à côté de app.py.

[server]
enableStaticServing = true          # sert b1/app/static (style.css, polices, illustrations) sous app/static/

[theme]
# Pas de « base » : avec [theme.light] et [theme.dark], la page suit le réglage clair ou sombre du système.
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.375rem", "1.375rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "0.625rem"
linkUnderline = true
showWidgetBorder = true
showSidebarBorder = true

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-700-normal.woff2"
weight = 700

[theme.light]
primaryColor = "#2547D0"
backgroundColor = "#F9F8F3"
secondaryBackgroundColor = "#F4F1EA"
textColor = "#172034"
linkColor = "#172034"
borderColor = "#E1DED5"
codeBackgroundColor = "#EEEBE2"
codeTextColor = "#172034"
# Accent cuivre : badges de citation (:orange-badge[S1]) et libellé « Cité dans la réponse »
orangeColor = "#C3773E"
orangeBackgroundColor = "#FFE8D9"
orangeTextColor = "#934F14"
# Texte secondaire (:gray[...])
grayColor = "#6B675D"
grayBackgroundColor = "#F4F1EA"
grayTextColor = "#6B675D"
# Couleurs d'état (st.info, st.success, st.warning, st.error)
blueColor = "#2547D0"
blueBackgroundColor = "#EAF0FF"
blueTextColor = "#2B4BAC"
greenColor = "#4A9A5E"
greenBackgroundColor = "#E0F7E4"
greenTextColor = "#236436"
yellowColor = "#DCA744"
yellowBackgroundColor = "#FFEED3"
yellowTextColor = "#7E5403"
redColor = "#CB4644"
redBackgroundColor = "#FFE9E6"
redTextColor = "#A12F2F"

[theme.light.sidebar]
backgroundColor = "#EEE9DE"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#4361E0"
backgroundColor = "#151411"
secondaryBackgroundColor = "#272521"
textColor = "#EEECE9"
linkColor = "#EEECE9"
borderColor = "#393632"
codeBackgroundColor = "#2D2B27"
codeTextColor = "#EEECE9"
# Accent cuivre : badges de citation (:orange-badge[S1]) et libellé « Cité dans la réponse »
orangeColor = "#DE8F57"
orangeBackgroundColor = "#462C19"
orangeTextColor = "#FCBF95"
# Texte secondaire (:gray[...])
grayColor = "#A8A49E"
grayBackgroundColor = "#272521"
grayTextColor = "#A8A49E"
# Couleurs d'état (st.info, st.success, st.warning, st.error)
blueColor = "#4361E0"
blueBackgroundColor = "#1F2C4C"
blueTextColor = "#B3CAFE"
greenColor = "#73C385"
greenBackgroundColor = "#1C3422"
greenTextColor = "#A4DFAF"
yellowColor = "#EBBC63"
yellowBackgroundColor = "#3E2D10"
yellowTextColor = "#EFCC8C"
redColor = "#ED756E"
redBackgroundColor = "#47211E"
redTextColor = "#FBB7B0"

[theme.dark.sidebar]
backgroundColor = "#1B1916"
secondaryBackgroundColor = "#272521"
codeBackgroundColor = "#2D2B27"
