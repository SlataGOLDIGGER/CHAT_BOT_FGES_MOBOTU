name: b1-portabilite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "b1/**"
      - ".github/workflows/b1-portabilite.yml"

permissions:
  contents: read

jobs:
  portabilite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      LLAMA_ARG_N_GPU_LAYERS: "0"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"

      - name: Environnement du volet B
        run: |
          uv venv --python 3.12.13 .venv-b1
          uv pip install --python .venv-b1 --only-binary :all: -r b1/requirements.txt
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "PY=.venv-b1/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "PY=.venv-b1/bin/python" >> "$GITHUB_ENV"
          fi

      - name: Modèles en cache (partagé entre systèmes)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            b1/models
            .hf
          key: modeles-${{ hashFiles('b1/config/models.lock.json') }}
          enableCrossOsArchive: true

      - name: Moteur llama.cpp figé
        run: $PY -m b1.scripts.installer_llama

      - name: Modèles à révision figée, empreintes vérifiées
        run: $PY -m b1.scripts.telecharger_modeles

      - name: Serveur local, génération, RAG et banc d'évaluation
        run: |
          $PY -m b1.scripts.lancer_serveur > serveur.log 2>&1 &
          SERVEUR=$!
          for i in $(seq 1 120); do
            grep -q "Serveur prêt" serveur.log && break
            sleep 5
          done
          grep -q "Serveur prêt" serveur.log
          $PY -m b1.scripts.generer_essai
          $PY -m b1.rag.demander "Quelle est la durée maximale d'un stage en entreprise ?"
          $PY -m b1.eval.executer --questions shared/eval/questions_dev.jsonl --limite 3 --nom "ci-$RUNNER_OS"
          $PY -m b1.eval.score_auto "artifacts/b1/runs/ci-$RUNNER_OS"
          kill "$SERVEUR" || true

      - name: Journal du serveur
        if: always()
        run: tail -n 40 serveur.log || true
